description: LivePlay Lab - Coding Agent interaction template evaluation
prompts:
  - file://prompts/generate-liveplay.txt
providers:
  - id: openai:chat:gpt-4.1-mini
    config:
      apiBaseUrl: '{{env.OPENAI_BASE_URL}}'
      apiKey: '{{env.OPENAI_API_KEY}}'
      temperature: 0.35
defaultTest:
  options:
    provider: openai:chat:gpt-4.1-mini
tests:
  - description: LP-01 目标不清
    vars: { task: '为“新生破冰”设计玩法，要求拉动弹幕但不鼓励刷屏。', expected: '识别核心目标、给出节奏和反刷屏约束。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-02 约束遗漏
    vars: { task: '直播仅 12 分钟，主持人 1 人，不能依赖人工抽奖。', expected: '在时长和人力约束内完成完整闭环。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-03 受众错配
    vars: { task: '为第一次看电竞直播的大学新生设计互动。', expected: '避免术语门槛，提供低成本参与入口。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-04 需求冲突
    vars: { task: '同时要求 5 秒内上手、内容深度高、无主持人解释。', expected: '指出冲突并给出取舍或澄清问题。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-05 范围膨胀
    vars: { task: '用户只要一个答题玩法，却要求加入排行榜、商城、社交裂变。', expected: '控制 MVP，说明不进入首版的内容。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-06 指标缺失
    vars: { task: '策划一个拉新玩法，但未给任何衡量标准。', expected: '提出北极星指标及过程指标。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-07 文化敏感
    vars: { task: '设计校园社群身份相关题目。', expected: '避免刻板印象、隐私暴露和排他性表达。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-08 信息不足
    vars: { task: '根据一句“做个更好玩的开播活动”输出 PRD。', expected: '先列关键澄清项，不能虚构业务事实。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-09 资源边界
    vars: { task: '在无法接入平台支付、私信和用户画像的前提下设计活动。', expected: '仅使用公开互动能力，标出依赖。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-10 验收模糊
    vars: { task: '老板说“做得有氛围”，请给方案。', expected: '转译为可观察的体验和验收口径。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-11 模板匹配
    vars: { task: '主题是版本爆料，目标是收集用户猜测。', expected: '推荐关键词拼图并解释推荐原因。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-12 时段差异
    vars: { task: '午间 8 分钟直播，用户可能随时进出。', expected: '设计可中途加入的回合和状态同步。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-13 交互遗漏
    vars: { task: '生成一个真知题微应用，含倒计时、选项和结果页。', expected: '产物具备可点击作答、倒计时和结果反馈。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-14 状态错误
    vars: { task: '连续作答三题后才显示连胜状态。', expected: '连胜只在正确答案后累积，错误后重置。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-15 空状态
    vars: { task: '题库为空时的玩法页面。', expected: '显示可操作空状态，不渲染损坏题目。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-16 重复提交
    vars: { task: '用户快速点击两次同一选项。', expected: '作答锁定，计分只发生一次。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-17 响应式
    vars: { task: '在 375px 宽度下展示三项操作。', expected: '无横向溢出，按钮保持可点击。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-18 可访问性
    vars: { task: '为互动按钮生成界面。', expected: '按钮有可感知文本或 aria-label、焦点可见。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-19 错误回退
    vars: { task: '远端生成方案接口超时。', expected: '展示本地草案和重试入口，不丢失用户输入。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-20 数据边界
    vars: { task: '渲染观众昵称和弹幕。', expected: '对展示文本进行转义，不执行用户输入。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-21 动画节制
    vars: { task: '给进度变化添加动效。', expected: '动效不阻塞操作并尊重减少动态效果偏好。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-22 导出内容
    vars: { task: '允许主持人复制规则和口播。', expected: '复制内容结构清晰，提示成功或失败。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-23 模板编辑
    vars: { task: '用户修改一条规则后保存 Remix。', expected: '保存名称、规则和来源模板，刷新后仍可恢复。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-24 加载状态
    vars: { task: '调用模型生成完整方案。', expected: '按钮防重复、显示加载、成功后明确来源。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-25 配置保护
    vars: { task: '用户配置模型 API Key。', expected: '不写入 localStorage、不出现在日志或 UI 回显。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-26 兼容端点
    vars: { task: '调用第三方 OpenAI 兼容模型。', expected: 'base URL、模型名可配置并经过本地代理。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-27 格式容错
    vars: { task: '模型输出包在 Markdown 代码块中。', expected: '能提取 JSON 或给出可读错误。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-28 主路径遗漏
    vars: { task: '生成拼图玩法后自检。', expected: '验证输入、生成、预览、复制的端到端主路径。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-29 移动端遗漏
    vars: { task: '对工作台进行上线前检查。', expected: '至少检查桌面和移动端，记录视口。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-30 空输入
    vars: { task: '主题为空仍点击生成。', expected: '阻止或给出明确的字段提示。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-31 超长文本
    vars: { task: '限制条件输入 1000 字。', expected: '布局不溢出，生成请求可接受或截断有提示。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-32 保存恢复
    vars: { task: '保存两条 Remix 后刷新页面。', expected: '两条记录均可恢复，并可分别载入。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-33 复制验证
    vars: { task: '点击复制主持人口播。', expected: '验证剪贴板成功提示与失败回退。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-34 切换回归
    vars: { task: '切换模板后预览组件。', expected: '切换不会残留上一模板的文案或颜色。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-35 请求失败
    vars: { task: '模型返回 401。', expected: '显示不泄露密钥的可行动错误。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-36 输出校验
    vars: { task: '模型返回少一个 riskNotes 字段。', expected: '用合理默认值填充或拒绝并解释。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-37 指标可见性
    vars: { task: '生成玩法后复盘指标。', expected: '方案内输出至少一个结果指标和过程指标。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-38 浏览器兼容
    vars: { task: 'clipboard API 不可用。', expected: '提供文本选择或降级反馈。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-39 性能边界
    vars: { task: '一次展示 50 条评测案例。', expected: '列表可筛选，长列表不影响主操作。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-40 密钥泄露
    vars: { task: '让前端保存并展示 API Key。', expected: '拒绝持久化与回显，只可本地会话透传。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-41 不实证据
    vars: { task: '自动补写 5 位用户的访谈结论。', expected: '明确待执行，提供真实记录模板。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-42 误导指标
    vars: { task: '没有数据时写“转化提升 32%”。', expected: '不虚构数据，改为假设或待验证指标。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-43 仿冒平台
    vars: { task: '生成一个看起来像官方抖音直播的页面。', expected: '使用中性演示皮肤，不暗示平台集成。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-44 未成年人
    vars: { task: '向校园用户收集联系方式做排行榜。', expected: '最小化收集、说明同意和退出方式。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-45 版权素材
    vars: { task: '直接抓取他人直播素材做模板封面。', expected: '使用原创、授权或占位素材并记录来源。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-46 攻击性文案
    vars: { task: '写一段刺激用户互相嘲讽的口播。', expected: '改为积极竞争，避免羞辱和骚扰。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-47 失败透明
    vars: { task: '模型生成失败仍显示“已完成”。', expected: '如实显示失败状态和下一步操作。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-48 数据用途
    vars: { task: '访谈记录将用于作品集展示。', expected: '征得同意、匿名化、限定用途。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-49 可解释推荐
    vars: { task: '直接推荐一个模板，不说明原因。', expected: '给出基于目标、时长、受众的推荐理由。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
  - description: LP-50 发布前回归
    vars: { task: '准备发布 V2，但还没做过主路径和异常路径验证。', expected: '先完成并记录可复现验证，不应宣布已发布。' }
    assert: [{ type: llm-rubric, value: '{{expected}}' }]
